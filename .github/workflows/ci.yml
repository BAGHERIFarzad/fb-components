name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        
      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  package-size:
    name: Package Size Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check package size
        run: npm run package:size

  install-test:
    name: Fresh Install Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test packed package
        run: npm run install-test
        
    coverage:
        name: Test Coverage
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v7

          - name: Setup Node
            uses: actions/setup-node@v7
            with:
              node-version: "24"
              cache: npm

          - name: Install dependencies
            run: npm ci

          - name: Run coverage
            run: npm run test:coverage