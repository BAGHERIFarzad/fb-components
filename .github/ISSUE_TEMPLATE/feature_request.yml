name: Feature request
description: Suggest a component, capability, or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to FB Components.
  - type: input
    id: area
    attributes:
      label: Area
      placeholder: Buttons / AI / Data / Packaging / Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: breaking
    attributes:
      label: Would this require a breaking API change?
      options:
        - "No"
        - "Maybe"
        - "Yes"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this request.
          required: true
