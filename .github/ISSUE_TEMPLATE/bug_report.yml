name: Bug report
description: Report a reproducible problem with FB Components
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before submitting:
        - Search existing issues to avoid duplicates.
        - Confirm the problem is reproducible with the latest published package version.
        - Do not include secrets, credentials, tokens, or private application data.

  - type: input
    id: component
    attributes:
      label: Component
      description: Which FB Components component is affected?
      placeholder: e.g. GlassButton, AiPromptBox, RadialProgress
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: FB Components version
      description: Which package version are you using?
      placeholder: e.g. 0.1.3
    validations:
      required: true

  - type: input
    id: react-version
    attributes:
      label: React version
      description: Which React version are you using?
      placeholder: e.g. 19.1.1
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Framework, bundler, browser, operating system, and Node version if relevant.
      placeholder: e.g. Vite 7, Chrome, Windows 11, Node 22
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable set of steps that reproduces the issue.
      placeholder: |
        1. Install ...
        2. Render ...
        3. Interact with ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Share a minimal reproduction, repository link, or focused code sample if possible.
      placeholder: |
        import { GlowButton } from "@farzadbagheri/fb-components/buttons";
        import "@farzadbagheri/fb-components/buttons.css";

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, logs, stack traces, or anything else that may help.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I tested with the latest available package version.
          required: true
        - label: I removed secrets, tokens, credentials, and private data from this report.
          required: true
